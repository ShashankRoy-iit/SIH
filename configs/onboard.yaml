# SAHYOG onboard configuration - the companion computer's only tunable file.
#
# Copy to the aircraft as /etc/sar/onboard.yaml (deploy/install_companion.sh
# does this) and edit there.  Anything omitted falls back to
# sar/hardware/onboard.py::DEFAULT_CONFIG, and the effective configuration is
# written into every sortie report, so a result can always be traced to the
# settings that produced it.

mode: flight              # dry-run | hitl | flight

mavlink:
  # TELEM2 on the TBS Lucid H743 Wing wired to the companion computer's UART.
  # Use /dev/ttyTHS0 on a Jetson, /dev/ttyHS1 on RB3 Gen 2, or udpin: if
  # mavlink-router sits in front of the autopilot.
  target: /dev/ttyACM0:921600
  source_system: 255
  source_component: 191          # onboard computer, not a GCS - ArduPilot routes
                                 # guidance from this component differently

cameras:
  # 80 ms: at 8 m/s that is 0.64 m of parallax, comfortably inside the
  # cross-modal association radius. Raise it and fusion silently degrades.
  max_skew_s: 0.08
  lwir:
    enabled: true
    device: 1                    # /dev/video1 - check with `v4l2-ctl --list-devices`
    width: 160                   # FLIR Lepton 3.5; Boson 320 -> 320x256
    height: 120
    fps: 9                       # Lepton is export-limited to 8.7 Hz
    hfov_deg: 57.0
    resolution_k: 0.01           # TLinear 0.01 K/count. 0.1 for the low-res mode.
    expect_radiometric: true     # refuse to fly on AGC video unless waived
  rgb:
    enabled: true
    device: 0
    width: 1280
    height: 720
    fps: 15
    hfov_deg: 66.0
    # On a Qualcomm board prefer the ISP path (no userspace copies):
    # gstreamer: "qtiqmmfsrc ! video/x-raw,format=NV12,width=1280,height=720 !
    #             videoconvert ! appsink drop=1 max-buffers=1"

detector: auto                   # auto | hybrid | heuristic | neural
perception_hz: 2.0               # matches the coverage planner's ground-speed math

mission:
  search_altitude_agl_m: 45.0
  confirm_altitude_agl_m: 22.0   # the two-pass confirmation altitude
  survey_speed_ms: 6.0
  area_north_m: 300.0
  area_east_m: 300.0

payload:
  enabled: true
  servo_channel: 9               # SERVO9_FUNCTION=59 (gripper)
  release_pwm: 1900
  hold_pwm: 1100

comms:
  transport: lora_900            # elrs_telemetry | lora_900 | wifi_bridge

safety:
  # Every one of these ends a sortie. They are deliberately conservative;
  # loosen them only with a signed-off reason in the field-test log.
  reserve_fraction: 0.25
  hover_power_w: 420.0           # MEASURE this on your airframe - do not trust
                                 # the motor datasheet
  cruise_speed_ms: 8.0
  max_range_m: 800.0             # also roughly the ELRS control-link edge
  max_altitude_agl_m: 120.0
  min_altitude_agl_m: 8.0
  max_telemetry_silence_s: 3.0
  max_loop_stall_s: 2.0
  max_position_sigma_m: 25.0
  max_denial_s: 90.0
  max_wind_ms: 12.0
  # Optional hard geofence, metres north/east of home:
  # geofence_polygon: [[-400, -400], [-400, 400], [400, 400], [400, -400]]

artifacts_dir: /var/log/sar
