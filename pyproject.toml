[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sar"
version = "0.1.0"
description = "Autonomous Search-and-Rescue On-Device Autonomy Stack"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sar*"]
