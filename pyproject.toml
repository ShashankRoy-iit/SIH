[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
# NOTE: the *distribution* is `sahyog-sar`, the *import package* is `sar`.
# They differ on purpose.  `sar` is already taken on PyPI by an unrelated
# synthetic-aperture-radar helper, and `pip install sar` shadows this project
# with something that has no `sar.core` - a confusing failure that this repo
# guards against in scripts/_bootstrap.py and scripts/doctor.py.
name = "sahyog-sar"
version = "0.2.0"
description = "SAHYOG - autonomous search-and-rescue drone autonomy stack (SIH PS 26177)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "SAHYOG / SIH 26177 team" }]
keywords = ["uav", "search-and-rescue", "ardupilot", "mavlink", "thermal", "edge-ai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
# Everything needed to fly a full simulated sortie with the dashboard.
sim = [
    "pymavlink>=2.4.37",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "pyyaml>=6.0",
    "matplotlib>=3.6",
    "pillow>=9.0",
]
# Neural detector backends.  onnxruntime is the flight path; ultralytics is
# training/export only and is intentionally not a flight dependency.
ai = [
    "onnxruntime>=1.16",
    "opencv-python-headless>=4.8",
]
train = [
    "ultralytics>=8.3.0",
    "torch>=2.1",
    "onnx>=1.15",
    "onnxsim>=0.4.33",
]
# Companion-computer (on-aircraft) extras: camera capture and serial links.
hardware = [
    "pymavlink>=2.4.37",
    "opencv-python-headless>=4.8",
    "pyserial>=3.5",
]
dev = [
    "pytest>=7.0",
    "pytest-timeout>=2.1",
    "ruff>=0.4",
]
all = [
    "sahyog-sar[sim,ai,hardware,dev]",
]

[project.scripts]
sar-doctor = "scripts.doctor:main"
sar-mission = "scripts.run_mission:main"
sar-rescue = "scripts.run_rescue_simulation:main"
sar-onboard = "scripts.run_onboard:main"
sar-benchmark = "scripts.benchmark_rescue_pipeline:main"
sar-eval = "scripts.eval_detector:main"

[project.urls]
Homepage = "https://github.com/ShashankRoy-iit/SIH"
Plan = "https://github.com/ShashankRoy-iit/SIH/blob/main/docs/PROJECT_PLAN.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["sar*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"
